# Shareable FOD config example.
# Copy this to fod_config.ini for local testing, then replace the password before installing anywhere shared.

[database]
# Legacy single-endpoint form. It remains supported and is treated as an endpoint
# whose server role must be verified after connecting.
host = 127.0.0.1
port = 5432
# Role-aware multi-endpoint form. Each value is a comma-separated host:port list.
# Phase 1 parses and diagnoses these lists only; runtime routing still uses host/port.
# Keep the legacy host/port configured until a later routing phase is enabled.
# Do not combine these keys with the transitional `hosts` key.
# primary_hosts = 127.0.0.1:15432,127.0.0.1:15433
# replica_hosts = 127.0.0.1:15442,127.0.0.1:15443
# Transitional form for installations that cannot declare roles yet. FOD must
# discover every endpoint through pg_is_in_recovery() and transaction_read_only.
# hosts = 127.0.0.1:15432,127.0.0.1:15442
# Environment overrides: FOD_PG_PRIMARY_HOSTS, FOD_PG_REPLICA_HOSTS, FOD_PG_HOSTS.
# Inspect the resolved topology with: fod-config endpoint-config
dbname = foddbname
user = foduser
password = change-me
#sslmode = require
#sslrootcert = /path/to/ca.crt
#sslcert = /etc/fod/.fod/tls/client.crt
#sslkey =  /etc/fod/.fod/tls/client.key

[fod]
# Optional profile selector; FOD_PROFILE remains an override.
# profile = bulk_write

# Mount/runtime semantics.
role = auto
force_read_only = false
selinux = off
acl = off
atime_policy = default
default_permissions = true
lazytime = false
sync = false
dirsync = false
log_level = info
use_fuse_context = true
use_rust_fuse = true

# FUSE event-loop and logical admission settings validated by FOD 3.2.60.
fuse_event_threads = 8
fuse_clone_fd = false
task_read_active_limit = 0
task_write_active_limit = 4
# PostgreSQL transaction admission is independent of the FUSE callback gate.
# Zero disables a lane. The balanced base preset reserves capacity for reads and
# keeps control/lease traffic separate from write transaction pressure.
pg_write_transaction_limit = 4
pg_control_transaction_limit = 2
# Global process-local budget for payload bytes admitted to PostgreSQL persist
# operations. 0 disables the byte gate. A request larger than the limit is
# admitted alone to avoid deadlock.
pg_payload_in_flight_limit_bytes = 64MiB
# Enables role-aware endpoint selection for primary_hosts/replica_hosts/hosts.
# Legacy single host+port keeps the existing single-DSN behavior.
pg_endpoint_routing_enabled = true
# Runtime failover is safe only when primary_hosts are HA/proxy entrypoints for
# the same authoritative PostgreSQL primary/cluster. Each new target is
# revalidated as writable before use.
pg_runtime_failover_enabled = true
# Opt-in: stale-sensitive reads use a healthy replica only after its replay LSN
# satisfies this process's latest observed primary WAL LSN.
pg_replica_read_routing_enabled = false

# Additional FUSE startup controls.
allow_other = false
# Optional SELinux mount-context overrides. Leave commented/empty to use the
# normal host policy and kernel defaults.
# selinux_context =
# selinux_fscontext =
# selinux_defcontext =
# selinux_rootcontext =
# entry_timeout_seconds = 1
# attr_timeout_seconds = 1
# negative_timeout_seconds = 0

# Canonical value-range rules live in rust_runtime/src/lib.rs.
pool_max_connections = 10
synchronous_commit = on
write_flush_threshold_bytes = 67108864
max_fs_size_bytes = 10GiB
# Optional override for what PostgreSQL can actually see on disk.
# If unset, FOD tries SHOW data_directory and statvfs() on that path.
# pg_visible_path = /var/lib/postgresql/data/pgdata
read_cache_eviction_policy = fifo
read_cache_blocks = 1024
read_ahead_blocks = 4
sequential_read_ahead_blocks = 8
small_file_read_threshold_blocks = 8
workers_read = 4
workers_read_min_blocks = 8
workers_write = 4
workers_write_min_blocks = 8
persist_buffer_chunk_blocks = 128
# persist_block_transport selects how file block batches are written:
# copy_binary_staging (default), binary_bytea, or legacy_hex.
persist_block_transport = copy_binary_staging
# data_object_swap_cleanup controls cleanup after full-overwrite data-object swaps:
# immediate (default) removes the old object rows inside the write transaction;
# deferred leaves unreferenced objects for an explicit GC benchmark/maintenance pass.
data_object_swap_cleanup = immediate
# Disable to improve sequential write throughput; enable to bypass kernel page cache.
fopen_direct_io = false
fuse_writeback_cache = false
copy_dedupe_enabled = false
copy_dedupe_min_blocks = 16
copy_dedupe_max_blocks = 0
copy_dedupe_crc_table = false
# Extent PoC retired in FOD 3.2.71; this legacy key is parsed for compatibility but production FUSE stays block-only.
enable_extents = false
# Bounded extent target; ignored by the default block-storage path.
extent_target_bytes = 1048576
metadata_cache_ttl_seconds = 1
statfs_cache_ttl_seconds = 2
lock_backend = postgres_lease
lock_lease_ttl_seconds = 30
lock_heartbeat_interval_seconds = 10
lock_poll_interval_seconds = 0.1
fopen_direct_io = false

[fod.profile.extents]
# Legacy extent PoC compatibility preset; production FUSE still enforces block-only persistence.
enable_extents = true
extent_target_bytes = 1048576

[fod-indexer]
# Skip hidden dotfiles and dot-directories by default.
skip_hidden = true
# Extra exact component names to skip even when they are not hidden.
skip_components = cache,caches,build,dist,node_modules,target,tmp,temp,out,__pycache__
# Extra nested path prefixes to skip. Values with / or \ are treated as prefixes.
# skip_prefixes = Android/data/com.example/cache,work/tmp
# Convenience alias that accepts either component names or nested prefixes.
# skip_paths = .venv,node_modules,work/cache
# Optional allowlist of file extensions to keep in the index.
# Files without one of these extensions are skipped in scan, hash, plan, materialize, and clean.
# allow_extensions = txt,pdf,jpg,jpeg,png,gif,webp,heic,doc,docx,xls,xlsx,ppt,pptx,csv,odt,ods,odp,gdoc,gsheet,gslides
