services:
  primary:
    build:
      context: .
      dockerfile: docker/postgres-blocksize/Dockerfile
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BLOCKSIZE_BASE_IMAGE:-postgres:16.15-alpine}
        POSTGRES_BLOCK_SIZE_KB: ${POSTGRES_BLOCK_SIZE_KB:-32}
    image: "fod-postgres-blocksize:16-${POSTGRES_BLOCK_SIZE_KB:-32}k"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foddbname}
      POSTGRES_USER: ${POSTGRES_USER:-foduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cichosza}
      POSTGRES_INITDB_ARGS: "--auth-local=trust --auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
      FOD_EXPECTED_PG_BLOCK_SIZE_BYTES: ${FOD_EXPECTED_PG_BLOCK_SIZE_BYTES:-32768}
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - synchronous_commit=on
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "${REPLICA_READ_BIND_ADDRESS:-127.0.0.1}:${REPLICA_READ_PRIMARY_PORT:-55441}:5432"
    volumes:
      - type: bind
        source: ${FOD_PG_BLOCK_TMPFS_PRIMARY_DIR:?FOD_PG_BLOCK_TMPFS_PRIMARY_DIR must point into /dev/shm}
        target: /var/lib/postgresql/data
      - ./docker/replica-read/primary-init.sh:/docker-entrypoint-initdb.d/10-fod-replication.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          test "$$(psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atqc
          'SHOW block_size')" = "$$FOD_EXPECTED_PG_BLOCK_SIZE_BYTES"
      interval: 1s
      timeout: 5s
      retries: 90
      start_period: 3s

  replica:
    build:
      context: .
      dockerfile: docker/postgres-blocksize/Dockerfile
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BLOCKSIZE_BASE_IMAGE:-postgres:16.15-alpine}
        POSTGRES_BLOCK_SIZE_KB: ${POSTGRES_BLOCK_SIZE_KB:-32}
    image: "fod-postgres-blocksize:16-${POSTGRES_BLOCK_SIZE_KB:-32}k"
    depends_on:
      primary:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foddbname}
      POSTGRES_USER: ${POSTGRES_USER:-foduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cichosza}
      PGDATA: /var/lib/postgresql/data/pgdata
      FOD_REPLICATION_USER: fod_repl
      FOD_REPLICATION_PASSWORD: fod_repl_pass
      FOD_EXPECTED_PG_BLOCK_SIZE_BYTES: ${FOD_EXPECTED_PG_BLOCK_SIZE_BYTES:-32768}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/fod-replica-entrypoint.sh
    ports:
      - "${REPLICA_READ_BIND_ADDRESS:-127.0.0.1}:${REPLICA_READ_REPLICA_PORT:-55442}:5432"
    volumes:
      - type: bind
        source: ${FOD_PG_BLOCK_TMPFS_REPLICA_DIR:?FOD_PG_BLOCK_TMPFS_REPLICA_DIR must point into /dev/shm}
        target: /var/lib/postgresql/data
      - ./docker/replica-read/replica-entrypoint.sh:/usr/local/bin/fod-replica-entrypoint.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          test "$$(psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atqc
          'SHOW block_size')" = "$$FOD_EXPECTED_PG_BLOCK_SIZE_BYTES" &&
          test "$$(psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atqc
          'SELECT pg_is_in_recovery()')" = "t"
      interval: 1s
      timeout: 5s
      retries: 120
      start_period: 3s
