x-postgres-settings: &postgres-settings
  build:
    context: ./docker/replica-read
  image: fod-ha-chain-postgres:16-alpine
  environment: &postgres-environment
    POSTGRES_DB: ${POSTGRES_DB:-foddbname}
    POSTGRES_USER: ${POSTGRES_USER:-foduser}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cichosza}
    PGDATA: /var/lib/postgresql/data/pgdata
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 1s
    timeout: 5s
    retries: 90
    start_period: 3s

services:
  master:
    <<: *postgres-settings
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - synchronous_commit=on
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "${HA_CHAIN_BIND_ADDRESS:-127.0.0.1}:${HA_CHAIN_MASTER_PORT:-55471}:5432"
    volumes:
      - ha_chain_master_data:/var/lib/postgresql/data

  slave1:
    <<: *postgres-settings
    depends_on:
      master:
        condition: service_healthy
    environment:
      <<: *postgres-environment
      FOD_REPLICATION_USER: fod_repl
      FOD_REPLICATION_PASSWORD: fod_repl_pass
      FOD_REPLICA_UPSTREAM_HOST: master
      FOD_REPLICA_APPLICATION_NAME: fod_ha_chain_slave1
    entrypoint: ["/bin/sh", "/usr/local/bin/fod-replica-entrypoint.sh"]
    ports:
      - "${HA_CHAIN_BIND_ADDRESS:-127.0.0.1}:${HA_CHAIN_SLAVE1_PORT:-55472}:5432"
    volumes:
      - ha_chain_slave1_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          test "$$(psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atqc
          'SELECT pg_is_in_recovery()')" = "t"
      interval: 1s
      timeout: 5s
      retries: 120
      start_period: 3s

  slave2:
    <<: *postgres-settings
    depends_on:
      master:
        condition: service_healthy
    environment:
      <<: *postgres-environment
      FOD_REPLICATION_USER: fod_repl
      FOD_REPLICATION_PASSWORD: fod_repl_pass
      FOD_REPLICA_UPSTREAM_HOST: master
      FOD_REPLICA_APPLICATION_NAME: fod_ha_chain_slave2
    entrypoint: ["/bin/sh", "/usr/local/bin/fod-replica-entrypoint.sh"]
    ports:
      - "${HA_CHAIN_BIND_ADDRESS:-127.0.0.1}:${HA_CHAIN_SLAVE2_PORT:-55473}:5432"
    volumes:
      - ha_chain_slave2_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          test "$$(psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atqc
          'SELECT pg_is_in_recovery()')" = "t"
      interval: 1s
      timeout: 5s
      retries: 120
      start_period: 3s

volumes:
  ha_chain_master_data:
  ha_chain_slave1_data:
  ha_chain_slave2_data:
